<style>
:root{--bg:#F6F3E6;--cd:#fff;--tx:#10281e;--mu:#6b7d73;--ac:#0B4F3A;--go:#D9A62B;--gd:#8A6410;--bd:#e8e4cf;--ok:#0f7a55;--wa:#b7791f;--no:#c0392b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
#app{max-width:640px;margin:0 auto;padding:0 14px 96px}
.hd{position:sticky;top:0;z-index:5;margin:0 -14px;padding:10px 14px;background:linear-gradient(135deg,#0B4F3A,#14694e);color:#fff;display:flex;align-items:center;gap:10px;box-shadow:0 2px 10px rgba(0,0,0,.18)}
.hd img{width:38px;height:38px;border-radius:10px;background:#fff;object-fit:cover}
.hd div{flex:1;line-height:1.2}.hd b{display:block;font-size:16px}.hd span{font-size:12px;opacity:.8}
.hd .b{background:rgba(255,255,255,.16);color:#fff;padding:8px 12px;font-size:13px;font-weight:500}
h1{font-size:22px;margin:16px 0 4px}
.mu{color:var(--mu);font-size:13px}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 2px 8px rgba(16,40,30,.05)}
.card.g{position:relative;overflow:hidden}.card.g::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--go)}
.av{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;object-fit:cover;background:#dfe9e3;color:var(--ac);font-weight:700;flex-shrink:0}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--bd)}
.row:last-child{border-bottom:0}
.act{display:flex;gap:6px;align-items:center;flex-shrink:0}
.chips{display:flex;gap:6px;margin:14px 0 10px;background:#ebe7d3;padding:4px;border-radius:14px}
.chips button{flex:1;padding:10px 6px;border:0;background:transparent;color:var(--tx);border-radius:11px;font:inherit;font-size:14px}
.chips button.on{background:#fff;color:var(--ac);font-weight:700;box-shadow:0 1px 4px rgba(0,0,0,.1)}
.b{padding:11px 16px;border:0;border-radius:12px;background:var(--ac);color:#fff;font:inherit;font-size:15px;font-weight:600;cursor:pointer;text-decoration:none;display:inline-block}
.b.g{background:transparent;color:var(--mu);border:1px solid var(--bd);font-weight:500}
.b.r{background:transparent;color:var(--no);border:1px solid var(--bd)}
.b.go{background:linear-gradient(135deg,#E8BC4A,#D9A62B);color:#2a1d00}
.b.w{background:#1fa855;color:#fff}
.b.full{width:100%;text-align:center}
.b:disabled{opacity:.6}
input,select,textarea{width:100%;padding:13px;border:1px solid var(--bd);border-radius:12px;background:#fff;color:var(--tx);font:inherit;margin:6px 0}
input:focus,select:focus,textarea:focus{outline:2px solid #bfe3cf;border-color:var(--ac)}
label{font-size:13px;color:var(--mu)}
.bd{font-size:12px;font-weight:600;padding:4px 10px;border-radius:20px}
.bd.paid{color:var(--ok);background:#e4f5ec}.bd.pending{color:var(--wa);background:#fbf0dc}.bd.unpaid{color:var(--no);background:#fbe6e3}
.paid{color:var(--ok)}.pending{color:var(--wa)}.unpaid{color:var(--no)}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}

.hands{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.hero{text-align:center;padding-top:18px}

.feat svg{flex-shrink:0;color:var(--ac)}
svg.ic{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.greet{background:linear-gradient(135deg,#0B4F3A,#1a6b4f);color:#fff;border-radius:18px;padding:18px;margin:14px 0}

.bn button.on{color:var(--ac);font-weight:700}
.bn .badge{position:absolute;top:0;right:20%}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--tx);color:#fff;padding:11px 18px;border-radius:12px;font-size:14px;display:none;z-index:9;max-width:90%}
.alert{background:#fde8e5;border:1px solid #f1b4ab;border-radius:14px;padding:14px;margin:12px 0;color:#7a1f14}
.alert .mu{color:#9b4a40}
.alert .row{border-bottom-color:#f1b4ab}
.banner{background:#e8f6ee;border:1px solid #bfe3cf;border-radius:14px;padding:14px;margin:12px 0}
.badge{background:var(--no);color:#fff;border-radius:20px;padding:1px 7px;font-size:11px;font-weight:700}
</style></head><body>

<script type="module">

function periods(g){const t=new Date();t.setHours(0,0,0,0);const o=[];
 if(g==="W"){const d=new Date(t);d.setDate(d.getDate()-d.getDay());for(let i=0;i<5;i++){o.push({k:key(d),l:dl(d)});d.setDate(d.getDate()-7)}}
 else if(g==="M"){for(let i=0;i<5;i++){const d=new Date(t.getFullYear(),t.getMonth()-i,1),e=new Date(d.getFullYear(),d.getMonth()+1,0);o.push({k:d.getFullYear()+pad(d.getMonth()+1),l:d.toLocaleDateString("en-GB",{month:"long",year:"numeric"})+" (due "+e.getDate()+")"})}}
 else{const a=S.settings.anchor;if(!a)return[];const A=new Date(a+"T00:00:00"),n=Math.floor(Math.round((t-A)/864e5)/2);for(let i=0;i<5&&n-i>=0;i++){const d=new Date(A);d.setDate(A.getDate()+2*(n-i));o.push({k:key(d),l:dl(d)})}}
 return o}
const keyLabel=(g,k)=>g==="M"?new Date(+k.slice(0,4),+k.slice(4)-1,1).toLocaleDateString("en-GB",{month:"long",year:"numeric"}):dl(new Date(+k.slice(0,4),+k.slice(4,6)-1,+k.slice(6)));

function loginMsg(name,code,act,url,ph){return "https://wa.me/"+phone(ph)+"?text="+encodeURIComponent(`Hello ${name}, welcome to KaffySmart Thrift online. Open ${url} and tap Member login, then "First time? Activate your account". Your code: ${code.toUpperCase()}. Activation code: ${act}. Enter your Gmail and choose your own password. Next time, log in with your code and password. Keep your password secret. After you pay, tap "I've paid". Save Together, Grow Together.`)}
const wa=(m,s,k,g)=>"https://wa.me/"+phone(m.phone)+"?text="+encodeURIComponent(`Hello ${m.name}, your ${GS[g]} contribution of ${N(amt(s))} for ${keyLabel(g,k)} has been confirmed ✅. Thank you! KaffySmart Thrift: Save Together, Grow Together`);

function render(){
 if(locked&&auth.currentUser){$("#app").innerHTML=lockView();return}
 const ae=document.activeElement;
 if(ae&&(ae.tagName==="INPUT"||ae.tagName==="TEXTAREA")&&ae.closest("#app")&&view==="app"){dirty=true;return}

 $("#app").innerHTML=view==="landing"?landing():view==="login"?login():view==="activate"?activateView():view==="finish"?finishView():view==="forgot"?forgotView():view==="terms"?termsView():admin?adminView():memberView();
}
document.addEventListener("focusout",()=>setTimeout(()=>{if(dirty)render()},60));

function landing(){const I=p=>`<svg class="ic" viewBox="0 0 24 24">${p}</svg>`;
 return `<div class="hero"><img src="logo.jpg" alt="KaffySmart Thrift"><button class="b go full" data-a="tologin" data-r="member" style="font-size:18px;padding:15px;margin-top:6px">Member login</button>${installEv?`<button class="b g full" data-a="install" style="margin-top:10px">Install the app on this phone</button>`:""}<div class="feat"><div>${I('<path d="M5 13l4 4L19 7"/>')}<span>See every payment you have made</span></div><div>${I('<path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/>')}<span>Follow the collection line, fairly and openly</span></div><div>${I('<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/>')}<span>Your own secret password keeps your account safe</span></div></div><a href="#" class="mu" data-a="tologin" data-r="admin">Admin login</a></div>`}
function login(){const m=role==="member";
 return `<div class="hero"><img src="logo.jpg" alt="KaffySmart Thrift" style="max-width:300px"></div><div class="card"><h1>${m?"Member login":"Admin login"}</h1>
 ${m?`<label>Your code</label><input id="u" placeholder="e.g. M001" autocapitalize="characters" autocomplete="username" value="${esc(loginCode)}"><label>Your password</label><input id="p" type="password" placeholder="Password" autocomplete="current-password">${askEmail?`<label>Your Gmail (new phone: asked once)</label><input id="em" type="email" placeholder="you@gmail.com" autocomplete="email">`:""}`
 :`<label>Email</label><input id="u" type="email" autocomplete="username"><label>Password</label><input id="p" type="password" autocomplete="current-password">`}
 <button class="b full" data-a="login" ${busy?"disabled":""}>${busy?"Please wait…":"Log in"}</button>${err?`<div class="unpaid" style="margin-top:10px">${esc(err)}</div>`:""}
 <div style="margin-top:14px;display:flex;justify-content:space-between;gap:10px">${m?`<a href="#" class="mu" data-a="toact">First time? Activate your account</a>`:"<span></span>"}<a href="#" class="mu" data-a="toforgot">Forgot password?</a></div>
 <div style="margin-top:12px"><a href="#" class="mu" data-a="home">← Back</a></div></div>`}
function activateView(){return `<div class="hero"><img src="logo.jpg" alt="KaffySmart Thrift" style="max-width:300px"></div><div class="card"><h1>Activate your account</h1><div class="mu" style="margin-bottom:6px">Use the code and activation code the admin sent you. Then enter your Gmail and choose your own password. You will use your code and password to log in.</div>
 <label>Your code</label><input id="ac" placeholder="e.g. M001" autocapitalize="characters" value="${esc(loginCode)}"><label>Activation code</label><input id="aa" inputmode="numeric" placeholder="From the admin"><label>Your Gmail</label><input id="ae" type="email" placeholder="you@gmail.com" autocomplete="email"><label>Choose a password (at least 8 characters)</label><input id="ap" type="password" autocomplete="new-password"><label>Type it again</label><input id="ap2" type="password" autocomplete="new-password">
 <button class="b full" data-a="activate" ${busy?"disabled":""}>${busy?"Please wait…":"Activate"}</button>${err?`<div class="unpaid" style="margin-top:10px">${esc(err)}</div>`:""}
 <div style="margin-top:12px"><a href="#" class="mu" data-a="tologin" data-r="member">← Back to login</a></div></div>`}
function finishView(){const u=auth.currentUser;return `<div class="hero"><img src="logo.jpg" alt="KaffySmart Thrift" style="max-width:300px"></div><div class="card"><h1>One more step</h1><div class="mu" style="margin-bottom:6px">You are logged in as ${esc(u?u.email:"")}, but this login is not linked to a member code yet. Enter your code and the activation code the admin sent you.</div>
 <label>Your code</label><input id="fc" placeholder="e.g. M001" autocapitalize="characters" value="${esc(loginCode)}"><label>Activation code</label><input id="fa" inputmode="numeric" placeholder="From the admin">

 <div style="margin-top:12px"><a href="#" class="mu" data-a="logout">Log out</a></div></div>`}

 <label>Your Gmail</label><input id="fe" type="email" placeholder="you@gmail.com" autocomplete="email"><button class="b full" data-a="forgot" ${busy?"disabled":""}>${busy?"Please wait…":"Send reset link"}</button>${err?`<div class="unpaid" style="margin-top:10px">${esc(err)}</div>`:""}${forgotMsg?`<div class="banner" style="margin-top:12px">${esc(forgotMsg)}</div>`:""}
 <div style="margin-top:12px"><a href="#" class="mu" data-a="tologin" data-r="member">← Back to login</a></div></div>`}

const av=(m,z)=>{z=z||40;const st=`width:${z}px;height:${z}px;font-size:${Math.round(z*.4)}px`;return m.photo?`<img class="av" style="${st}" src="${m.photo}" alt="">`:`<span class="av" style="${st}">${esc((m.name||"?").trim().slice(0,1).toUpperCase())}</span>`};
const shrink=f=>new Promise((res,rej)=>{const img=new Image(),u=URL.createObjectURL(f);img.onload=()=>{const c=document.createElement("canvas"),z=160,sc=Math.max(z/img.width,z/img.height),w=img.width*sc,h=img.height*sc;c.width=c.height=z;c.getContext("2d").drawImage(img,(z-w)/2,(z-h)/2,w,h);URL.revokeObjectURL(u);res(c.toDataURL("image/jpeg",.72))};img.onerror=rej;img.src=u});
const FEE0={D:500,W:1000,M:1000};
const fee=g=>(S.settings.fees&&S.settings.fees[g]!=null)?S.settings.fees[g]:FEE0[g];
const byNick=n=>Object.values(S.members).find(m=>(m.nick||"").trim().toLowerCase()===String(n).trim().toLowerCase());
const kd=(g,k)=>g==="M"?new Date(+k.slice(0,4),+k.slice(4)-1,1):new Date(+k.slice(0,4),+k.slice(4,6)-1,+k.slice(6));
const cycN=(g,k0,k)=>{const a=kd(g,k0),b=kd(g,k);if(g==="M")return(b.getFullYear()-a.getFullYear())*12+b.getMonth()-a.getMonth();return Math.floor(Math.round((b-a)/864e5)/(g==="D"?2:7))};
const collector=(g,k)=>{const L=S.lines[g];if(!L||!L.slots||!L.slots.length||!L.startKey)return null;const n=cycN(g,L.startKey,k),len=L.slots.length,i=(((L.startPos-1+n)%len)+len)%len;return{pos:i+1,nick:L.slots[i],amount:len*U[g]-fee(g),len}};
const turnDate=(g,k,i)=>{const d=kd(g,k);if(g==="M"){d.setMonth(d.getMonth()+i);return d.toLocaleDateString("en-GB",{month:"long",year:"numeric"})}d.setDate(d.getDate()+i*(g==="D"?2:7));return dl(d)};
const remLink=(m,s,k)=>"https://wa.me/"+phone(m.phone)+"?text="+encodeURIComponent(`Hello ${m.name}, a gentle reminder: your ${GS[s.g]} contribution of ${N(amt(s))} for ${keyLabel(s.g,k)} has not been received yet. Please pay and tap "I've paid" on the website: ${location.origin+location.pathname} . Thank you. KaffySmart Thrift`);

const FPK=()=>"fp:"+(auth.currentUser?auth.currentUser.uid:"");
const b64=b=>btoa(String.fromCharCode(...new Uint8Array(b)));
const unb64=t=>Uint8Array.from(atob(t),c=>c.charCodeAt(0));
const fpOn=()=>{try{return !!localStorage.getItem(FPK())}catch(e){return false}};
async function fpSupported(){try{return !!(window.PublicKeyCredential&&await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable())}catch(e){return false}}
async function fpEnable(){const u=auth.currentUser;
 const cr=await navigator.credentials.create({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),rp:{name:"KaffySmart Thrift",id:location.hostname},user:{id:new TextEncoder().encode(u.uid),name:u.email,displayName:u.email},pubKeyCredParams:[{type:"public-key",alg:-7},{type:"public-key",alg:-257}],authenticatorSelection:{authenticatorAttachment:"platform",userVerification:"required",residentKey:"discouraged"},timeout:60000}});
 localStorage.setItem(FPK(),b64(cr.rawId))}
async function fpCheck(){await navigator.credentials.get({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),allowCredentials:[{type:"public-key",id:unb64(localStorage.getItem(FPK()))}],userVerification:"required",timeout:60000}})}
function fpCard(){
 if(!fpOK)return '<div class="card mu">Fingerprint lock is not available on this phone or browser.</div>';
 return fpOn()?`<div class="card"><b>Fingerprint lock is ON</b><div class="mu" style="margin:4px 0 10px">This phone asks for your fingerprint or face before opening your account.</div><button class="b g" data-a="fpoff">Turn off</button></div>`
 :`<div class="card"><b>Fingerprint lock</b><div class="mu" style="margin:4px 0 10px">Open your account with your fingerprint or face on this phone. Tap Lock instead of Log out, and next time you can choose fingerprint or your code and password.</div><button class="b" data-a="fpon">Turn on</button></div>`}

function backup(){

  await Promise.all(jobs)}catch(x){part="payments"}
 stp="payouts";
 try{await Promise.all(["D","W","M"].filter(g=>S.subs[code+"_"+g]&&S.subs[code+"_"+g].hands>0).map(async g=>{const k0=(periods(g)[0]||{}).k;if(!k0)return;const x=await getDoc(doc(db,"payouts",g+"_"+k0));if(x.exists())S.payouts[g+"_"+k0]=x.data()}))}catch(x){part="payouts"}
 stp="show";
 const tx=S.settings.terms,tv=S.settings.termsV||1,mt=S.members[code].terms;
 if(tx&&(!mt||mt.v<tv))view="terms";else if(view==="terms")view="app";

 }catch(x){if(!x.stp)x.stp=stp;throw x}}

  else if(a==="toact"){view="activate";err="";render()}

  else if(a==="activate"){const code=($("#ac").value||"").trim().toLowerCase(),act=($("#aa").value||"").trim(),em=($("#ae").value||"").trim().toLowerCase(),p1=$("#ap").value||"",p2=$("#ap2").value||"";loginCode=code;

    await setDoc(doc(db,"members",code),{uid:cr.user.uid,actTry:act,email:em},{merge:true});

   catch(x){activating=false;busy=false;try{await signOut(auth)}catch(z){}const cd=x.code||"";
    err=cd==="auth/invalid-credential"||cd==="auth/wrong-password"?"This Gmail already has an account. Use the same password you chose before, or tap Forgot password.":cd==="auth/weak-password"?"Please choose a stronger password.":cd==="auth/network-request-failed"?"No internet connection. Please try again.":(cd==="permission-denied"||/permission|insufficient/i.test(x.message||""))?"The code or the activation code is not correct, or this account is already activated. Please check with the admin.":"Could not activate. Check your internet and try again.";view="activate";render()}}
  else if(a==="forgot"){const em=($("#fe").value||"").trim().toLowerCase();

   catch(x){err=x.code==="auth/too-many-requests"?"Too many requests. Please wait a few minutes and try again.":"Could not send the email. Check your internet and try again."}
   busy=false;render()}
  else if(a==="logout"){await signOut(auth)}
    else if(a==="bulkclose"){bulkRes=[];render()}

    const ph=p[1]||"",h=[2,3,4].map(i=>parseFloat(p[i])||0),act=String(Math.floor(10000000+Math.random()*90000000)),code="m"+String(mx+1).padStart(3,"0");
    try{await setDoc(doc(db,"members",code),{code,name,nick:p[5]||"",phone:ph,uid:null,act,at:new Date().toISOString()});mx++;
     for(let i=0;i<3;i++){if(h[i]>0)await setDoc(doc(db,"subs",code+"_"+"DWM"[i]),{code,g:"DWM"[i],hands:h[i]})}
     bulkRes.push({ok:1,code,name,act,phone:ph,link:loginMsg(name,code,act,url,ph)})}
    catch(x){bulkRes.push({ok:0,name,msg:"Could not add this person. Check the line."})}}
   try{await setDoc(doc(db,"settings","main"),{maxCode:mx},{merge:true})}catch(x){}
   bulkTxt="";busy=false;render()}

   if(!slots.length){toast("Paste the line first");return}
   await setDoc(doc(db,"lines",g),{slots},{merge:true});delete lineTxt[g];toast("Line saved: "+slots.length+" places")}
  else if(a==="setpos"){const n=parseInt($("#sp").value),len=((S.lines[g]||{}).slots||[]).length;
   if(!n||n<1||n>len){toast("Enter a number from 1 to "+len);return}
   await setDoc(doc(db,"lines",g),{startKey:k,startPos:n},{merge:true});toast("Saved")}
  else if(a==="payout"){const cc=collector(g,k);await setDoc(doc(db,"payouts",g+"_"+k),{g,k,nick:cc?cc.nick:"",amount:cc?cc.amount:0,at:new Date().toISOString()});toast("Marked as paid out")}
  else if(a==="unpayout"){await deleteDoc(doc(db,"payouts",g+"_"+k));toast("Undone")}
  else if(a==="fees"){const f={};for(const x of ["D","W","M"])f[x]=parseFloat($("#fe_"+x).value)||0;await setDoc(doc(db,"settings","main"),{fees:f},{merge:true});toast("Saved")}
  else if(a==="clrask"){clr=g;render()}
  else if(a==="clrdo"){await deleteDoc(doc(db,"lines",g));clr="";delete lineTxt[g];toast("Line cleared")}
  else if(a==="rmask"){rm=c;render()}
  else if(a==="rmdo"){const mm=S.members[c];if(mm&&mm.uid)await deleteDoc(doc(db,"uids",mm.uid));await deleteDoc(doc(db,"members",c));for(const gg of ["D","W","M"])await deleteDoc(doc(db,"subs",c+"_"+gg));rm="";toast("Member removed")}
  else if(a==="pick"){$("#pf").click()}
  else if(a==="agree"){if(!$("#tk").checked){toast("Please tick the box to continue");return}
   const t={v:S.settings.termsV||1,at:new Date().toISOString()};await setDoc(doc(db,"members",me),{terms:t},{merge:true});S.members[me].terms=t;view="app";render();toast("Thank you")}
  else if(a==="saveterms"){const t=($("#tc").value||"").trim();await setDoc(doc(db,"settings","main"),{terms:t,termsV:(S.settings.termsV||0)+1},{merge:true});toast(t?"Terms saved. Members will be asked to accept.":"Terms removed")}
  else if(a==="install"){if(installEv){installEv.prompt();try{await installEv.userChoice}catch(x){}installEv=null;render()}}
  else if(a==="backup"){backup();toast("Backup downloaded")}
  else if(a==="lock"){locked=true;render()}
  else if(a==="unlock"){try{await fpCheck();locked=false;err="";render()}catch(x){err="Fingerprint not recognised. Try again.";render()}}
  else if(a==="fpon"){try{await fpEnable();toast("Fingerprint lock is on");render()}catch(x){toast("Could not turn it on. Make sure a fingerprint is set up in your phone settings.")}}
  else if(a==="fpoff"){try{localStorage.removeItem(FPK())}catch(x){}toast("Fingerprint lock is off");render()}
  else if(a==="rstclose"){rstRes=null;render()}
  else if(a==="rsask"){rsq=c;render()}
  else if(a==="rsdo"){const m=S.members[c];if(!m)return;rsq="";busy=true;render();
   try{const act=String(Math.floor(10000000+Math.random()*90000000));
    if(m.uid)await deleteDoc(doc(db,"uids",m.uid));
    await setDoc(doc(db,"members",c),{uid:null,act,email:null},{merge:true});
    rstRes={name:m.name,code:c,act,phone:m.phone};toast("Account reset. Send the member the new activation code.")}
   catch(x){toast("Could not reset the account. Try again.")}
   busy=false;render()}
  else if(a==="refresh"){await loadMember();toast("Updated")}
  else if(a==="dismiss"){last=null;render()}
  else if(a==="report"){await setDoc(doc(db,"reports",id),{code:c,g,k,at:new Date().toISOString()});await loadMember();toast("Sent. Waiting for the admin to confirm.")}
  else if(a==="confirm"){const s=S.subs[c+"_"+g],m=S.members[c];await setDoc(doc(db,"payments",id),{code:c,g,k,amount:s?amt(s):0,at:new Date().toISOString()});if(S.reports[id])await deleteDoc(doc(db,"reports",id));last={name:m.name,url:wa(m,s,k,g)};render()}
  else if(a==="undo"){await deleteDoc(doc(db,"payments",id));toast("Payment removed")}
  else if(a==="reject"){await deleteDoc(doc(db,"reports",id));toast("Removed")}

   try{const mx=Object.keys(S.members).reduce((x,y)=>Math.max(x,parseInt(y.slice(1))||0),S.settings.maxCode||0),code="m"+String(mx+1).padStart(3,"0"),act=String(Math.floor(10000000+Math.random()*90000000));

   busy=false;render()}

   remind="Reminder: "+GS[grp]+" contribution for "+p.l+" has not been received from:\n"+un.map((s,i)=>(i+1)+". "+S.members[s.code].name+" ("+N(amt(s))+")").join("\n")+"\n\nPlease pay and tap “I’ve paid” on the website. Thank you.";render()}

/* ---------- START ---------- */
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();installEv=e;render()});
window.addEventListener("appinstalled",()=>{installEv=null;render()});
fpSupported().then(v=>{fpOK=v;render()});
document.addEventListener("visibilitychange",()=>{if(document.hidden)lastHide=Date.now();else if(auth.currentUser&&fpOn()&&Date.now()-lastHide>90000){locked=true;render()}});
async function route(u){
 unsub.forEach(f=>f());unsub=[];firstSnap={};
 Object.assign(S,{members:{},subs:{},payments:{},reports:{},settings:{},lines:{},payouts:{}});
 busy=false;
 if(!u){locked=false;view=["login","activate","forgot"].includes(view)?view:"landing";admin=false;me="";document.title="KaffySmart Thrift";render();return}
 if(u.email===ADMIN){admin=true;view="app";locked=skipLock?false:fpOn();skipLock=false;
  ["members","subs","payments","reports","lines","payouts"].forEach(c=>unsub.push(onSnapshot(c==="payments"?query(collection(db,c),where("at",">=",new Date(Date.now()-170*864e5).toISOString())):collection(db,c),s=>{S[c]={};s.docs.forEach(d=>S[c][d.id]=d.data());
   if(c==="reports"){if(firstSnap.r&&s.docChanges().some(x=>x.type==="added")){beep();toast("New payment report")}firstSnap.r=1}render()})));
  unsub.push(onSnapshot(doc(db,"settings","main"),s=>{S.settings=s.data()||{};render()}));render();return}
 admin=false;let code="";
 try{const ud=await getDoc(doc(db,"uids",u.uid));if(ud.exists())code=ud.data().code}catch(x){}
 if(!code){role="member";view="finish";err="";locked=false;skipLock=false;render();return}
 if(expectCode&&expectCode!==code){err="That Gmail is not linked to this code.";expectCode="";role="member";view="login";skipLock=false;await signOut(auth);return}
 expectCode="";me=code;locked=skipLock?false:fpOn();skipLock=false;view="app";render();
 try{await loadMember()}catch(x){err="Your account could not be loaded ("+(x.stp||"?")+": "+(x.code||x.message||"error")+"). Please send this message to the admin.";role="member";view="login";await signOut(auth)}
}
onAuthStateChanged(auth,u=>{if(activating&&u)return;route(u)});
