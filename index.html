<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KaffySmart Thrift</title>
<link rel="icon" href="icon.png">
<style>
:root{--bg:#F8F5E4;--cd:#fff;--tx:#10281e;--mu:#667a70;--ac:#0B4F3A;--go:#D9A62B;--gd:#8A6410;--bd:#e3dfc6;--ok:#0f7a55;--wa:#b7791f;--no:#c0392b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:640px;margin:0 auto;padding:16px 14px 50px}
h1{font-size:21px;margin:6px 0 2px}
.mu{color:var(--mu);font-size:13px}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:14px;margin:12px 0}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--bd)}
.row:last-child{border-bottom:0}
.act{display:flex;gap:6px;align-items:center;flex-shrink:0}
.tabs,.chips{display:flex;gap:6px;margin:10px 0}
.tabs button,.chips button{flex:1;padding:10px 6px;border:1px solid var(--bd);background:var(--cd);color:var(--tx);border-radius:10px;font:inherit;font-size:14px}
.tabs button.on,.chips button.on{background:var(--ac);border-color:var(--ac);color:#fff}
.b{padding:10px 14px;border:0;border-radius:10px;background:var(--ac);color:#fff;font:inherit;font-size:15px;cursor:pointer;text-decoration:none;display:inline-block}
.b.g{background:transparent;color:var(--mu);border:1px solid var(--bd)}
.b.r{background:transparent;color:var(--no);border:1px solid var(--bd)}
.b.go{background:var(--go);color:#2a1d00;font-weight:600}
.b.w{background:#1fa855;color:#fff}
.b.full{width:100%;text-align:center}
input,select,textarea{width:100%;padding:12px;border:1px solid var(--bd);border-radius:10px;background:#fff;color:var(--tx);font:inherit;margin:6px 0}
label{font-size:13px;color:var(--mu)}
.bd{font-size:12px;padding:3px 9px;border-radius:20px;border:1px solid currentColor}
.paid{color:var(--ok)}.pending{color:var(--wa)}.unpaid{color:var(--no)}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.sum b{display:block;font-size:22px}
.hands{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.hero{text-align:center;padding-top:18px}
.hero img{width:100%;max-width:520px;height:auto}
.hero p{color:var(--ac);font-size:18px;font-style:italic;margin:6px 0 22px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.top img{height:38px}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--tx);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;display:none;z-index:9;max-width:90%}
.banner{background:#e8f6ee;border:1px solid #bfe3cf;border-radius:12px;padding:12px;margin:10px 0}
.badge{background:var(--no);color:#fff;border-radius:20px;padding:1px 8px;font-size:12px;margin-left:4px}
</style></head><body>
<div id="app"><p class="mu">Loading…</p></div><div id="toast"></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged,createUserWithEmailAndPassword} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,doc,getDoc,setDoc,deleteDoc,collection,onSnapshot} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const cfg={apiKey:"AIzaSyBD9i0KT8jSqmaIFN_AH94IhUwY9mns034",authDomain:"kaffysmart-thrift.firebaseapp.com",projectId:"kaffysmart-thrift",storageBucket:"kaffysmart-thrift.firebasestorage.app",messagingSenderId:"951421433400",appId:"1:951421433400:web:2a15f0cd73a0829111d8cd"};
const ADMIN="adedejikafilah@gmail.com";
const DOM="@kaffysmart.app";
const fapp=initializeApp(cfg),auth=getAuth(fapp),db=getFirestore(fapp);

const U={D:500,W:3000,M:10000},GL={D:"Every 2 days · ₦500",W:"Weekly (Sunday) · ₦3,000",M:"Monthly · ₦10,000"},GS={D:"Every 2 days",W:"Weekly",M:"Monthly"};
const S={members:{},subs:{},payments:{},reports:{},settings:{}};
let view="landing",role="member",admin=false,me="",tab="status",grp="D",pi=0,err="",busy=false,dirty=false,remind="",last=null,firstSnap={},unsub=[];
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const N=n=>"₦"+Number(n||0).toLocaleString("en-NG");
const pad=n=>String(n).padStart(2,"0");
const key=d=>d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate());
const dl=d=>d.toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short",year:"numeric"});
const toast=t=>{const e=$("#toast");e.textContent=t;e.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display="none",3000)};
const beep=()=>{try{const a=new (window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator();o.connect(a.destination);o.frequency.value=880;o.start();setTimeout(()=>{o.stop();a.close()},260)}catch(e){}};

function periods(g){const t=new Date();t.setHours(0,0,0,0);const o=[];
 if(g==="W"){const d=new Date(t);d.setDate(d.getDate()-d.getDay());for(let i=0;i<5;i++){o.push({k:key(d),l:dl(d)});d.setDate(d.getDate()-7)}}
 else if(g==="M"){for(let i=0;i<5;i++){const d=new Date(t.getFullYear(),t.getMonth()-i,1),e=new Date(d.getFullYear(),d.getMonth()+1,0);o.push({k:d.getFullYear()+pad(d.getMonth()+1),l:d.toLocaleDateString("en-GB",{month:"long",year:"numeric"})+" (due "+e.getDate()+")"})}}
 else{const a=S.settings.anchor;if(!a)return[];const A=new Date(a+"T00:00:00"),n=Math.floor(Math.round((t-A)/864e5)/2);for(let i=0;i<5&&n-i>=0;i++){const d=new Date(A);d.setDate(A.getDate()+2*(n-i));o.push({k:key(d),l:dl(d)})}}
 return o}
const keyLabel=(g,k)=>g==="M"?new Date(+k.slice(0,4),+k.slice(4)-1,1).toLocaleDateString("en-GB",{month:"long",year:"numeric"}):dl(new Date(+k.slice(0,4),+k.slice(4,6)-1,+k.slice(6)));
const sid=(c,g,k)=>c+"_"+g+"_"+k;
const stat=(c,g,k)=>S.payments[sid(c,g,k)]?"paid":S.reports[sid(c,g,k)]?"pending":"unpaid";
const amt=s=>U[s.g]*s.hands;
const subsFor=g=>Object.values(S.subs).filter(s=>s.g===g&&s.hands>0&&S.members[s.code]).sort((a,b)=>S.members[a.code].name.localeCompare(S.members[b.code].name));
const badge=s=>`<span class="bd ${s}">${s==="paid"?"Paid":s==="pending"?"Pending":"Unpaid"}</span>`;
const btn=(a,l,s,k,c)=>`<button class="b ${c||""}" data-a="${a}" data-c="${s.code}" data-g="${s.g}" data-k="${k}">${l}</button>`;
const hw=h=>h+" hand"+(h==1?"":"s");
const phone=p=>{p=String(p||"").replace(/\D/g,"");if(p.startsWith("0"))p="234"+p.slice(1);return p};
const wa=(m,s,k,g)=>"https://wa.me/"+phone(m.phone)+"?text="+encodeURIComponent(`Hello ${m.name}, your ${GS[g]} contribution of ${N(amt(s))} for ${keyLabel(g,k)} has been confirmed ✅. Thank you! KaffySmart Thrift: Save Together, Grow Together`);

function render(){
 const ae=document.activeElement;
 if(ae&&ae.tagName==="INPUT"&&ae.closest("#app")&&view==="app"){dirty=true;return}
 dirty=false;
 $("#app").innerHTML=view==="landing"?landing():view==="login"?login():admin?adminView():memberView();
}
document.addEventListener("focusout",()=>setTimeout(()=>{if(dirty)render()},60));

function landing(){return `<div class="hero"><img src="logo.jpg" alt="KaffySmart Thrift"><p>Save Together, Grow Together</p><button class="b go full" data-a="tologin" data-r="member" style="font-size:18px;padding:14px">Member login</button><div style="margin-top:16px"><a href="#" class="mu" data-a="tologin" data-r="admin">Admin</a></div></div>`}
function login(){const m=role==="member";
 return `<div class="hero"><img src="logo.jpg" alt="KaffySmart Thrift" style="max-width:300px"></div><div class="card"><h1>${m?"Member login":"Admin login"}</h1>
 ${m?`<label>Your code</label><input id="u" placeholder="e.g. M001" autocapitalize="characters" autocomplete="username"><label>Your PIN</label><input id="p" type="password" inputmode="numeric" placeholder="PIN" autocomplete="current-password">`
 :`<label>Email</label><input id="u" type="email" autocomplete="username"><label>Password</label><input id="p" type="password" autocomplete="current-password">`}
 <button class="b full" data-a="login" ${busy?"disabled":""}>${busy?"Please wait…":"Log in"}</button>${err?`<div class="unpaid" style="margin-top:10px">${esc(err)}</div>`:""}
 <div style="margin-top:12px"><a href="#" class="mu" data-a="home">← Back</a></div></div>`}

/* ---------- ADMIN ---------- */
function adminView(){const np=Object.keys(S.reports).length;document.title=(np?"("+np+") ":"")+"KaffySmart Thrift";
 let h=`<div class="top"><img src="logo.jpg" alt="KaffySmart"><button class="b g" data-a="logout">Log out</button></div><h1>Admin dashboard</h1>`;
 if(last)h+=`<div class="banner"><b>Confirmed ✅</b> ${esc(last.name)}<div style="margin:8px 0 0"><a class="b w" target="_blank" rel="noopener" href="${last.url}">Send WhatsApp confirmation</a> <button class="b g" data-a="dismiss">Close</button></div></div>`;
 h+='<div class="tabs">'+[["status","Status"],["pending","Pending"+(np?`<span class="badge">${np}</span>`:"")],["members","Members"]].map(([t,l])=>`<button data-t="${t}" class="${tab===t?"on":""}">${l}</button>`).join("")+"</div>";
 return h+(tab==="status"?statusTab():tab==="pending"?pendingTab():membersTab())}
function statusTab(){
 let h='<div class="chips">'+["D","W","M"].map(g=>`<button data-gp="${g}" class="${grp===g?"on":""}">${GS[g]}</button>`).join("")+"</div>";
 const ps=periods(grp);
 if(!ps.length)return h+`<div class="card"><b>Set the start date</b><div class="mu">Pick the first day of the ₦500 cycle. Every 2 days is counted from it.</div><input type="date" id="anc" value="${esc(S.settings.anchor||"")}"><button class="b" data-a="anchor">Save</button></div>`;
 if(pi>=ps.length)pi=0;
 const k=ps[pi].k,list=subsFor(grp);let paid=0,pend=0,un=0,got=0,exp=0;
 list.forEach(s=>{const st=stat(s.code,grp,k);exp+=amt(s);if(st==="paid"){paid++;got+=amt(s)}else if(st==="pending")pend++;else un++});
 h+=`<select id="per">${ps.map((p,i)=>`<option value="${i}" ${i===pi?"selected":""}>${esc(p.l)}${i===0?" (current)":""}</option>`).join("")}</select>`;
 h+=`<div class="card sum"><div><b class="paid">${paid}</b><span class="mu">Paid</span></div><div><b class="pending">${pend}</b><span class="mu">Pending</span></div><div><b class="unpaid">${un}</b><span class="mu">Unpaid</span></div></div><div class="mu">Collected ${N(got)} of ${N(exp)} expected</div>`;
 h+='<div class="card">'+(list.length?list.map(s=>{const m=S.members[s.code],st=stat(s.code,s.g,k);return `<div class="row"><div><b>${esc(m.name)}</b> <span class="mu">${s.code.toUpperCase()} · ${hw(s.hands)}</span><div class="mu">${N(amt(s))}</div></div><div class="act">${badge(st)}${st==="paid"?btn("undo","Undo",s,k,"g"):btn("confirm",st==="pending"?"Confirm":"Mark paid",s,k)}</div></div>`}).join(""):'<div class="mu">No one is in this group yet. Add members in the Members tab.</div>')+"</div>";
 if(un){h+='<button class="b g full" data-a="remind">Write reminder for unpaid</button>';if(remind)h+=`<textarea id="rm" rows="6" style="margin-top:8px">${esc(remind)}</textarea><div class="mu">Select all, copy, and paste into your WhatsApp group.</div>`}
 return h}
function pendingTab(){const r=Object.entries(S.reports);
 if(!r.length)return '<div class="card mu">Nothing waiting. When members tap “I’ve paid”, it shows here.</div>';
 return '<div class="card">'+r.map(([id,x])=>{const m=S.members[x.code],s=S.subs[x.code+"_"+x.g]||{code:x.code,g:x.g,hands:0};
  return `<div class="row"><div><b>${esc(m?m.name:x.code)}</b> <span class="mu">${x.code.toUpperCase()}</span><div class="mu">${GS[x.g]} · ${esc(keyLabel(x.g,x.k))} · ${N(amt(s))}</div></div><div class="act">${btn("confirm","Confirm",s,x.k)}${btn("reject","✕",s,x.k,"r")}</div></div>`}).join("")+"</div>"}
function membersTab(){const ms=Object.values(S.members).sort((a,b)=>a.code.localeCompare(b.code));
 let h=`<div class="card"><b>Add member</b><input id="nm" placeholder="Full name"><input id="ph" type="tel" placeholder="WhatsApp number, e.g. 0803…"><input id="pn" inputmode="numeric" placeholder="PIN (4 to 6 digits)" value="${String(Math.floor(1000+Math.random()*9000))}"><div class="mu" style="margin-bottom:8px">Give the member their code and this PIN.</div><button class="b" data-a="addm" ${busy?"disabled":""}>${busy?"Adding…":"Add member"}</button></div>`;
 h+=ms.map(m=>`<div class="card"><b>${esc(m.name)}</b> <span class="mu">Code: <b>${m.code.toUpperCase()}</b></span><div class="hands">${["D","W","M"].map(g=>`<div><label>${GS[g]} hands</label><input type="number" min="0" step="0.5" id="h_${m.code}_${g}" value="${(S.subs[m.code+"_"+g]||{}).hands||0}"></div>`).join("")}</div><button class="b" data-a="hands" data-c="${m.code}">Save hands</button></div>`).join("");
 return h+`<div class="card"><b>₦500 cycle start date</b><input type="date" id="anc" value="${esc(S.settings.anchor||"")}"><button class="b g" data-a="anchor">Save</button></div>`}

/* ---------- MEMBER ---------- */
function memberView(){const m=S.members[me];
 if(!m)return '<p class="mu">Loading…</p>';
 const my=Object.values(S.subs).filter(s=>s.code===me&&s.hands>0).sort((a,b)=>a.g.localeCompare(b.g));
 let h=`<div class="top"><img src="logo.jpg" alt="KaffySmart"><button class="b g" data-a="logout">Log out</button></div><h1>Hello, ${esc(m.name)}</h1><div class="mu">Your code: ${me.toUpperCase()}</div>`;
 if(!my.length)h+='<div class="card mu">You are not in any contribution yet.</div>';
 my.forEach(s=>{h+=`<div class="card"><b>${GL[s.g]}</b><div class="mu">${hw(s.hands)} · ${N(amt(s))} each time</div>`;
  const ps=periods(s.g).slice(0,4);
  h+=ps.length?ps.map(p=>{const st=stat(me,s.g,p.k);return `<div class="row"><div>${esc(p.l)}</div><div class="act">${badge(st)}${st==="unpaid"?btn("report","I’ve paid",s,p.k):""}</div></div>`}).join(""):'<div class="mu">Not started yet.</div>';
  h+="</div>"});
 return h+'<div class="mu">After you transfer, tap “I’ve paid”. The admin confirms it against the bank alert and you will see it change to Paid. No receipt needed.</div><button class="b g full" data-a="refresh" style="margin-top:12px">Refresh</button>'}
async function loadMember(){
 const code=me,[m,st]=await Promise.all([getDoc(doc(db,"members",code)),getDoc(doc(db,"settings","main"))]);
 if(!m.exists())throw new Error("no-member");
 S.members={[code]:m.data()};S.settings=st.exists()?st.data():{};S.subs={};S.payments={};S.reports={};
 const ds=await Promise.all(["D","W","M"].map(g=>getDoc(doc(db,"subs",code+"_"+g))));
 const jobs=[];
 ds.filter(d=>d.exists()).forEach(d=>{const s=d.data();S.subs[d.id]=s;if(s.hands>0)periods(s.g).slice(0,4).forEach(p=>{const id=sid(code,s.g,p.k);
  jobs.push(getDoc(doc(db,"payments",id)).then(x=>{if(x.exists())S.payments[id]=x.data()}),getDoc(doc(db,"reports",id)).then(x=>{if(x.exists())S.reports[id]=x.data()}))})});
 await Promise.all(jobs);render()}

/* ---------- ACTIONS ---------- */
document.addEventListener("change",e=>{if(e.target.id==="per"){pi=+e.target.value;remind="";render()}});
document.addEventListener("click",async e=>{
 const el=e.target.closest("[data-t],[data-gp],[data-a]");if(!el)return;
 if(el.tagName==="A")e.preventDefault();
 if(el.dataset.t){tab=el.dataset.t;remind="";render();return}
 if(el.dataset.gp){grp=el.dataset.gp;pi=0;remind="";render();return}
 const a=el.dataset.a,c=el.dataset.c,g=el.dataset.g,k=el.dataset.k,id=c&&sid(c,g,k);
 try{
  if(a==="tologin"){role=el.dataset.r;view="login";err="";render()}
  else if(a==="home"){view="landing";err="";render()}
  else if(a==="login"){const u=($("#u").value||"").trim(),p=($("#p").value||"").trim();if(!u||!p){err="Please fill both boxes.";render();return}
   busy=true;err="";render();
   try{const email=role==="member"?u.toLowerCase()+DOM:u,pw=role==="member"?p+"-"+u.toLowerCase():p;await signInWithEmailAndPassword(auth,email,pw)}
   catch(x){busy=false;err=role==="member"?"Wrong code or PIN. Please check and try again.":"Wrong email or password.";if(x.code==="auth/api-key-not-valid"||x.code==="auth/invalid-api-key")err="Setup problem: the site key is not valid.";render()}}
  else if(a==="logout"){await signOut(auth)}
  else if(a==="refresh"){await loadMember();toast("Updated")}
  else if(a==="dismiss"){last=null;render()}
  else if(a==="report"){await setDoc(doc(db,"reports",id),{code:c,g,k,at:new Date().toISOString()});await loadMember();toast("Sent. Waiting for the admin to confirm.")}
  else if(a==="confirm"){const s=S.subs[c+"_"+g],m=S.members[c];await setDoc(doc(db,"payments",id),{code:c,g,k,amount:s?amt(s):0,at:new Date().toISOString()});if(S.reports[id])await deleteDoc(doc(db,"reports",id));last={name:m.name,url:wa(m,s,k,g)};render()}
  else if(a==="undo"){await deleteDoc(doc(db,"payments",id));toast("Payment removed")}
  else if(a==="reject"){await deleteDoc(doc(db,"reports",id));toast("Removed")}
  else if(a==="addm"){const n=($("#nm").value||"").trim(),ph=($("#ph").value||"").trim(),pin=($("#pn").value||"").trim();
   if(!n){toast("Enter a name");return}if(!/^\d{4,6}$/.test(pin)){toast("PIN must be 4 to 6 digits");return}
   busy=true;render();
   try{const mx=Object.keys(S.members).reduce((x,y)=>Math.max(x,parseInt(y.slice(1))||0),0),code="m"+String(mx+1).padStart(3,"0");
    const sec=initializeApp(cfg,"sec"+Date.now()),sa=getAuth(sec),cr=await createUserWithEmailAndPassword(sa,code+DOM,pin+"-"+code);
    await setDoc(doc(db,"members",code),{code,name:n,phone:ph,uid:cr.user.uid,at:new Date().toISOString()});await signOut(sa);
    toast("Added. Code: "+code.toUpperCase()+"  PIN: "+pin)}catch(x){toast("Could not add member. Try again.")}
   busy=false;render()}
  else if(a==="hands"){for(const gg of ["D","W","M"]){const v=parseFloat($("#h_"+c+"_"+gg).value)||0,r=doc(db,"subs",c+"_"+gg);if(v>0)await setDoc(r,{code:c,g:gg,hands:v});else if(S.subs[c+"_"+gg])await deleteDoc(r)}toast("Saved")}
  else if(a==="anchor"){const v=$("#anc").value;if(!v){toast("Pick a date");return}await setDoc(doc(db,"settings","main"),{anchor:v});toast("Saved")}
  else if(a==="remind"){const p=periods(grp)[pi],un=subsFor(grp).filter(s=>stat(s.code,grp,p.k)==="unpaid");
   remind="Reminder: "+GS[grp]+" contribution for "+p.l+" has not been received from:\n"+un.map((s,i)=>(i+1)+". "+S.members[s.code].name+" ("+N(amt(s))+")").join("\n")+"\n\nPlease pay and tap “I’ve paid” on the website. Thank you.";render()}
 }catch(x){toast("Something went wrong. Check your internet and try again.")}
});

/* ---------- START ---------- */
onAuthStateChanged(auth,async u=>{
 unsub.forEach(f=>f());unsub=[];firstSnap={};
 Object.assign(S,{members:{},subs:{},payments:{},reports:{},settings:{}});
 busy=false;
 if(!u){view=view==="login"?"login":"landing";admin=false;me="";document.title="KaffySmart Thrift";render();return}
 if(u.email===ADMIN){admin=true;view="app";
  ["members","subs","payments","reports"].forEach(c=>unsub.push(onSnapshot(collection(db,c),s=>{S[c]={};s.docs.forEach(d=>S[c][d.id]=d.data());
   if(c==="reports"){if(firstSnap.r&&s.docChanges().some(x=>x.type==="added")){beep();toast("New payment report")}firstSnap.r=1}render()})));
  unsub.push(onSnapshot(doc(db,"settings","main"),s=>{S.settings=s.data()||{};render()}));render();return}
 if(u.email&&u.email.endsWith(DOM)){admin=false;me=u.email.split("@")[0];view="app";render();
  try{await loadMember()}catch(x){err="This account is not set up yet. Please contact the admin.";await signOut(auth)}return}
 await signOut(auth);
});
</script></body></html>
